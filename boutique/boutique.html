<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boutique — CluxXEo Vente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/boutique.css"/>
</head>
<body>

<!-- NAV -->
<nav>
<a href="../index.html" class="nav-logo"><img src="../logo.png" alt="CluxXEo Vente"></a>
  <ul class="nav-links">
    <li><a href="../index.html">Accueil</a></li>
    <li><a href="../boutique/boutique.html">Boutique</a></li>
    <li><a href="../infos.html">Infos pratiques</a></li>
  </ul>
  <button class="nav-cart" onclick="openCart()">
    🛍 Panier <span class="cart-count" id="cart-count">0</span>
  </button>
</nav>

<!-- HEADER BOUTIQUE -->
<div class="boutique-header" style="padding-top: calc(4rem + 72px);">
  <div>
    <div class="section-label">Catalogue</div>
    <h2>Nos vêtements</h2>
  </div>
  <p><span id="product-count">0</span> articles disponibles</p>
</div>

<!-- FILTRES -->
<div class="filter-group">
  <div class="filter-group-label">Genre</div>
  <div class="filters" id="filter-genre">
    <button class="filter-btn active" onclick="setFilter('genre','tous', this)">Tous</button>
    <button class="filter-btn" onclick="setFilter('genre','homme', this)">Homme</button>
    <button class="filter-btn" onclick="setFilter('genre','femme', this)">Femme</button>
    <button class="filter-btn" onclick="setFilter('genre','enfant', this)">Enfant</button>
    <button class="filter-btn" onclick="setFilter('genre','bebe', this)">Bébé</button>
  </div>
</div>

<div class="filter-group">
  <div class="filter-group-label">Taille</div>
  <div class="filters" id="filter-taille">
    <button class="filter-btn active" onclick="setFilter('taille','tous', this)">Toutes</button>
    <!-- Rempli dynamiquement selon le genre sélectionné -->
  </div>
</div>

<div class="filter-group">
  <div class="filter-group-label">Type</div>
  <div class="filters" id="filter-type">
    <button class="filter-btn active" onclick="setFilter('cat','tous', this)">Tous</button>
    <button class="filter-btn" onclick="setFilter('cat','tshirt', this)">T-shirts</button>
    <button class="filter-btn" onclick="setFilter('cat','sweat', this)">Pull/Sweat</button>
    <button class="filter-btn" onclick="setFilter('cat','bas', this)">Bas</button>
  </div>
</div>

<!-- GRILLE PRODUITS -->
<div class="products-grid" id="products-grid"></div>

<!-- FOOTER -->
<footer>
  <div class="logo">CluxXEo <span style="font-style:italic;color:var(--sage-light)">Vente</span></div>
  <p>Vente de vêtements seconde main · La Réunion 🌺</p>
  <p>© 2025 CluxXEo Vente — Tous droits réservés</p>
</footer>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SCRIPTS -->
<!-- index.js chargé en premier : il contient tous les articles -->
<script src="index.js"></script>
<!-- nav.js : toast, navigation -->
<script src="../js/nav.js"></script>
<script>
  // ─── FILTRES ACTIFS ───
  const activeFilters = { genre: 'tous', taille: 'tous', cat: 'tous' };

  // ─── MISE À JOUR DES BOUTONS TAILLE SELON LE GENRE ───
  function updateTailleFilters() {
    const container = document.getElementById('filter-taille');
    const genre = activeFilters.genre;

    // Reset taille si on change de genre
    activeFilters.taille = 'tous';

    if (genre === 'tous') {
      container.innerHTML = `<button class="filter-btn active" onclick="setFilter('taille','tous', this)">Toutes</button>`;
      return;
    }

    const tailles = taillesParGenre[genre] || [];
    let html = `<button class="filter-btn active" onclick="setFilter('taille','tous', this)">Toutes</button>`;
    tailles.forEach(t => {
      html += `<button class="filter-btn" onclick="setFilter('taille','${t}', this)">${tailleLabels[t]}</button>`;
    });
    container.innerHTML = html;
  }

  // ─── DÉFINIR UN FILTRE ───
  function setFilter(type, value, btn) {
    activeFilters[type] = value;

    // Met à jour l'état visuel des boutons du même groupe
    const groupId = type === 'genre' ? 'filter-genre' : type === 'taille' ? 'filter-taille' : 'filter-type';
    document.querySelectorAll(`#${groupId} .filter-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Si on change le genre, on régénère les boutons de taille
    if (type === 'genre') {
      updateTailleFilters();
    }

    renderProducts();
  }

  // ─── AFFICHAGE DES PRODUITS ───
  function renderProducts() {
    const grid = document.getElementById('products-grid');
    const countEl = document.getElementById('product-count');

    let articles = getTousLesArticles();

    if (activeFilters.genre !== 'tous') {
      articles = articles.filter(a => a.genre === activeFilters.genre);
    }
    if (activeFilters.taille !== 'tous') {
      articles = articles.filter(a => a.taille === activeFilters.taille);
    }
    if (activeFilters.cat !== 'tous') {
      articles = articles.filter(a => a.cat === activeFilters.cat);
    }

    if (countEl) countEl.textContent = articles.length;

    // Boutique vide
    if (articles.length === 0) {
      grid.innerHTML = `
        <div class="boutique-vide">
          <div class="empty-icon">🧺</div>
          <p>Aucun article ne correspond à ces filtres</p>
          <p>Essaie d'élargir ta recherche 🌿</p>
        </div>`;
      return;
    }

    // Affichage des cartes
    grid.innerHTML = articles.map(a => `
      <div class="product-card">
        <div class="product-img" style="background:#EDE8DF">
          <span class="product-badge" style="background:${etatCouleurs[a.etat] || '#7A9E7E'}">${a.etat}</span>
          ${a.image
            ? `<img src="${a.image}" alt="${a.name}" style="width:100%;height:100%;object-fit:cover;"/>`
            : `<span style="font-size:4rem;opacity:.35">👕</span>`
          }
        </div>
        <div class="product-info">
          <div class="product-name">${a.name}</div>
          <div class="product-meta">
            <span class="tag">${genreLabels[a.genre] || a.genre}</span>
            <span class="tag">${tailleLabels[a.taille] || a.size}</span>
            <span class="tag">${catLabels[a.cat] || a.cat}</span>
          </div>
          <div class="product-footer">
            <span class="product-price">${a.price} €</span>
            <button class="btn-reserve" onclick="window.location.href='${a.stripeLink}'">Réserver</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Lancement au chargement
  document.addEventListener('DOMContentLoaded', () => {
    renderProducts();
  });
</script>

</body>
</html>
</body>
</html>
